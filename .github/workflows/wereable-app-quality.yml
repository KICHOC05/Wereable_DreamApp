name: WereableApp quality and security

on:
  pull_request:
    paths:
      - "dreamapp-devsecops-hardened-main/WereableApp/**"
      - ".github/workflows/wereable-app-quality.yml"
  push:
    branches: [main]
    tags: ["wereable-v*"]
    paths:
      - "dreamapp-devsecops-hardened-main/WereableApp/**"
      - ".github/workflows/wereable-app-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wereable-app-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_DIR: dreamapp-devsecops-hardened-main/WereableApp

jobs:
  android-quality:
    name: Android lint, tests and debug build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dreamapp-devsecops-hardened-main/WereableApp
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Enable Gradle wrapper
        run: chmod +x gradlew
      - name: Run lint, unit tests and debug build
        run: ./gradlew lintDebug testDebugUnitTest assembleDebug --no-daemon --warning-mode=all

  secret-scan:
    name: WereableApp secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan repository history
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  dependency-and-config-scan:
    name: WereableApp dependency and configuration scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Scan Android project
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: dreamapp-devsecops-hardened-main/WereableApp
          scanners: vuln,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
          skip-files: dreamapp-devsecops-hardened-main/WereableApp/appmobile/google-services.json

  signed-release:
    name: Signed WereableApp release
    if: startsWith(github.ref, 'refs/tags/wereable-v')
    needs: [android-quality, secret-scan, dependency-and-config-scan]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dreamapp-devsecops-hardened-main/WereableApp
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/wereable-release.jks"
      - name: Build signed bundles
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/wereable-release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$RELEASE_STORE_PASSWORD"
          test -n "$RELEASE_KEY_ALIAS"
          test -n "$RELEASE_KEY_PASSWORD"
          chmod +x gradlew
          ./gradlew :appmobile:bundleRelease :dashboardapp:bundleRelease :wear:bundleRelease --no-daemon
      - name: Upload signed bundles
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wereable-app-release-${{ github.ref_name }}
          path: |
            dreamapp-devsecops-hardened-main/WereableApp/**/build/outputs/bundle/release/*.aab
            dreamapp-devsecops-hardened-main/WereableApp/**/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
