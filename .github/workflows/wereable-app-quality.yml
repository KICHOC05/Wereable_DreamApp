name: WereableApp quality and security

on:
  pull_request:
    paths:
      - "**"
      - ".github/workflows/wereable-app-quality.yml"
  push:
    branches: [main]
    tags: ["wereable-v*"]
    paths:
      - "**"
      - ".github/workflows/wereable-app-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wereable-app-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-quality:
    name: Android lint, tests and debug build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Enable Gradle wrapper
        run: chmod +x gradlew
      - name: Run lint, unit tests and debug build
        run: ./gradlew lintDebug testDebugUnitTest assembleDebug --no-daemon --warning-mode=all

  secret-scan:
    name: WereableApp secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Scan WereableApp source
        run: >-
          docker run --rm
          -v "$GITHUB_WORKSPACE:/repo"
          zricethezav/gitleaks:v8.24.3
          detect
          --source=/repo
          --no-git
          --config=/repo/.gitleaks.toml
          --redact
          --no-banner
          --exit-code=1

  dependency-and-config-scan:
    name: WereableApp dependency and configuration scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Scan Android project
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
          format: sarif
          output: trivy-filesystem.sarif
          skip-files: appmobile/google-services.json
      - name: Upload Trivy findings
        if: always()
        uses: github/codeql-action/upload-sarif@42947a340483f03ba47bb1a039b2c519aab3df85 # v3
        with:
          sarif_file: trivy-filesystem.sarif
