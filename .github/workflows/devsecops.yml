name: DevSecOps pipelines

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * 1"

permissions:
  contents: read

concurrency:
  group: devsecops-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sensitive-artifact-guard:
    name: Sensitive artifact guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reject tracked Firebird databases and backups
        shell: pwsh
        run: ./dreamapp-devsecops-hardened-main/sleep-analysis-dreamapp-api/scripts/security/check-sensitive-artifacts.ps1

  backend:
    name: Backend quality and tests
    runs-on: ubuntu-latest
    needs: sensitive-artifact-guard
    defaults:
      run:
        working-directory: dreamapp-devsecops-hardened-main/sleep-analysis-dreamapp-api
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Enable Gradle wrapper
        run: chmod +x gradlew
      - name: Static analysis
        run: ./gradlew detekt --no-daemon
      - name: Tests, coverage gate and application build
        run: ./gradlew test jacocoTestCoverageVerification shadowJar --no-daemon --warning-mode=all
        env:
          DB_ENABLED: "false"
      - name: OWASP dependency scan
        run: ./gradlew dependencyCheckAnalyze --no-daemon
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
      - name: Upload backend reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-quality-reports
          path: |
            dreamapp-devsecops-hardened-main/sleep-analysis-dreamapp-api/build/reports/
            dreamapp-devsecops-hardened-main/sleep-analysis-dreamapp-api/build/test-results/
          retention-days: 30

  firebase-functions:
    name: Firebase Functions
    runs-on: ubuntu-latest
    needs: sensitive-artifact-guard
    defaults:
      run:
        working-directory: dreamapp-devsecops-hardened-main/sleep-functions/functions
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dreamapp-devsecops-hardened-main/sleep-functions/functions/package-lock.json
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Type-check and build
        run: npm run build

  web:
    name: Web application
    runs-on: ubuntu-latest
    needs: sensitive-artifact-guard
    defaults:
      run:
        working-directory: dreamapp-devsecops-hardened-main/dreamapp-web
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.12.1
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: dreamapp-devsecops-hardened-main/dreamapp-web/pnpm-lock.yaml
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit dependencies
        run: pnpm audit --audit-level high
      - name: Type-check and build
        run: pnpm run build

  android:
    name: Android lint and unit tests
    runs-on: ubuntu-latest
    needs: sensitive-artifact-guard
    defaults:
      run:
        working-directory: dreamapp-devsecops-hardened-main/WereableApp
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Enable Gradle wrapper
        run: chmod +x gradlew
      - name: Run lint and unit tests
        run: ./gradlew lintDebug testDebugUnitTest --no-daemon

  gitleaks:
    name: Full-history secret scan
    runs-on: ubuntu-latest
    needs: sensitive-artifact-guard
    steps:
      - name: Checkout full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan Git history
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  trivy-filesystem:
    name: Filesystem and IaC scan
    runs-on: ubuntu-latest
    needs: sensitive-artifact-guard
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Scan repository
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
          format: sarif
          output: trivy-filesystem.sarif
          skip-files: dreamapp-devsecops-hardened-main/WereableApp/appmobile/google-services.json
      - name: Upload Trivy findings
        if: always()
        uses: github/codeql-action/upload-sarif@42947a340483f03ba47bb1a039b2c519aab3df85 # v3
        with:
          sarif_file: trivy-filesystem.sarif

  sbom:
    name: Generate SPDX SBOM
    runs-on: ubuntu-latest
    needs: sensitive-artifact-guard
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Generate SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: spdx-json
          output: sbom.spdx.json
          skip-files: dreamapp-devsecops-hardened-main/WereableApp/appmobile/google-services.json
      - name: Upload SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-spdx
          path: sbom.spdx.json
          retention-days: 90

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    needs: sensitive-artifact-guard
    permissions:
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@42947a340483f03ba47bb1a039b2c519aab3df85 # v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
          build-mode: ${{ matrix.build-mode }}
      - name: Set up JDK 17 for Java/Kotlin analysis
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Set up Gradle for Java/Kotlin analysis
        if: matrix.language == 'java-kotlin'
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Build backend for CodeQL
        if: matrix.language == 'java-kotlin'
        working-directory: dreamapp-devsecops-hardened-main/sleep-analysis-dreamapp-api
        run: |
          chmod +x gradlew
          ./gradlew clean compileKotlin --no-daemon
      - name: Build Android modules for CodeQL
        if: matrix.language == 'java-kotlin'
        working-directory: dreamapp-devsecops-hardened-main/WereableApp
        run: |
          chmod +x gradlew
          ./gradlew :appmobile:compileDebugKotlin :dashboardapp:compileDebugKotlin :wear:compileDebugKotlin --no-daemon
      - name: Analyze
        uses: github/codeql-action/analyze@42947a340483f03ba47bb1a039b2c519aab3df85 # v3

  container:
    name: Build, publish and scan API image
    runs-on: ubuntu-latest
    needs: [backend, trivy-filesystem]
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349 # v3.7.1
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804 # v5.7.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: type=sha,format=long,prefix=ci-
      - name: Build API image
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: dreamapp-devsecops-hardened-main/sleep-analysis-dreamapp-api
          load: true
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan final API image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.tags }}
          format: sarif
          output: trivy-image.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
      - name: Upload image findings
        if: always()
        uses: github/codeql-action/upload-sarif@42947a340483f03ba47bb1a039b2c519aab3df85 # v3
        with:
          sarif_file: trivy-image.sarif

  dast:
    name: Scheduled OWASP ZAP baseline
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Scan public web application
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: https://dreamapp-sleep-web.onrender.com
          allow_issue_writing: false
          fail_action: true
